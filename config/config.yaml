# Relative paths are resolved from the repo root.

# --- Shared inputs used by dataset / training scripts ------------------------
paths:
  training_dataset: "/fs2/ftype_mflf/shared_data/dataset/1.2.0/raw/forest_type_dataset_raw_20250909_102320.parquet"
  logs_dir: "logs"

# --- Prediction (src/prediction_ftype_2_2_1.py, src/run_aoi_prediction.py) ---
prediction:
  model_version: "2.2.2"
  model_root: "model"                      # -> model/mfl_v2_2_2/{*.keras, config/}; training writes here too
  model_file: "hybrid_lstm_cnn_model-*-no-leakage.keras"   # glob inside model/mfl_v<version>/
  datacube_dir: "/fs2/ftype_mflf/shared_data/datacube/2025/1.2.0"   # shared, read-only
  output_dir: "outputs/prediction/1.2.0"   # -> <zone>/model_version_<v>/pred_<year>_*.tif
  years: [2019, 2020, 2021, 2022, 2023, 2024, 2025]
  batch_size: 128

# AOI to summarise. Drop the file in data/aoi/ and point `path` at it.
aoi:
  path: "data/aoi/ftype_lu_addarea_dissolved_cmf_moo.geojson"
  id_fields: ["CMF_Name", "Moo", "Tambon", "Amphoe", "Province"]
  buffer_km: 0                             # grow polygons by N km (0 = as drawn); output -> <stem>_buf<N>km/
  output_dir: "outputs/aoi"                # -> <aoi file stem>/...
